# 蓝牙
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y

# USB (插线时也能用)
CONFIG_ZMK_USB=y
CONFIG_USB_COMPOSITE_DEVICE=y

# ZMK Studio 支持
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# 省电: 闲置15分钟后深度睡眠
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 电池电量上报
CONFIG_ZMK_BATTERY_REPORTING=y
